schema_version = 1
repository = "NakamaDevs/kengen"
kind = "fork"
governance_version = "2.1.0"

[skills]
bundle = "NakamaDevs/skills"
version = "1.0.0"
source = "https://github.com/NakamaDevs/skills.git"
revision = "907fbb1785e03ab91ac70d750e0b2e44521e6aa3"

[upstream]
repository = "openfga/openfga"
branch = "main"
patch_policy = "minimal"

[linear]
team = "NAK"
project = "Kengen"

[quality]
quick = "mise run verify:quick"
full = "mise run verify"
hooks_install = "not available until NAK-902"

[review]
router = "nakama-review-change"

[harness]
agent_ready = false

[ci]
actions_enabled = false
reason = "NAK-902 defines the boundary. An administrator must enable Actions after independent review."
trusted_workflow = ".github/workflows/safe-fork-gates.yml"
upstream_workflow_quarantine = ".github/upstream-workflows-disabled"

[deployment]
host = "kengen.lecksfrawen.com"
issue = "NAK-903"
runner_host = "hdbmm"
runner_os = "macOS"
runner_arch = "ARM64"
runner_group = "nakama-kengen-deploy"
workflow = ".github/workflows/deploy.yml@refs/heads/main"
registry = "localhost:5050"
image_platform = "linux/arm64"

[delivery]
mode = "solo"
profile = ".nakama/delivery.json"
