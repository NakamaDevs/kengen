name: Safe fork gates

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  trusted-verification:
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: nakama-linux-x64
    permissions:
      contents: read
    steps:
      - name: Check out the trusted pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run the full verification gate
        run: mise run verify

  untrusted-metadata:
    if: github.event_name == 'pull_request' && (github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: nakama-untrusted-metadata-linux-x64
    permissions: {}
    steps:
      - name: Record blocked pull request metadata
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ""
          script: core.notice(`Untrusted pull request #${context.payload.pull_request.number}`)

  safe-fork-gate:
    if: always()
    needs: [trusted-verification, untrusted-metadata]
    runs-on: nakama-untrusted-metadata-linux-x64
    permissions: {}
    steps:
      - name: Record safe gate result
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ""
          script: |
            const trustedResult = "${{ needs.trusted-verification.result }}"
            const pullRequest = context.payload.pull_request
            const isBlockedPullRequest = context.eventName === 'pull_request' &&
              (pullRequest.user.login === 'dependabot[bot]' ||
                pullRequest.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`)

            if (isBlockedPullRequest) {
              core.setFailed('Code verification is blocked until OPS-283 provides an approved disposable Linux runner')
            } else if (trustedResult !== 'success') {
              core.setFailed(`Trusted verification result is ${trustedResult}`)
            } else {
              core.notice('Code verification completed successfully')
            }
