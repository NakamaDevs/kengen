name: Safe fork gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  trusted-verification:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the code on a fresh hosted runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the pinned verification toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654
        with:
          version: 2026.7.17
          install_args: --locked
          cache: false
      - name: Run the full verification gate
        run: mise run verify

  safe-fork-gate:
    if: always() && github.event.repository.visibility == 'public'
    needs: [trusted-verification]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Record safe gate result
        shell: bash
        env:
          VERIFICATION_RESULT: ${{ needs.trusted-verification.result }}
        run: |
          if [[ "${VERIFICATION_RESULT}" != "success" ]]; then
            printf 'Code verification result is %s\n' "${VERIFICATION_RESULT}" >&2
            exit 1
          fi
          printf 'Code verification completed successfully\n'
