# NakamaDevs integration: release deployment to the dedicated M1 runner.
name: Deploy Kengen

on:
  workflow_call:
    inputs:
      tag:
        required: false
        type: string
    secrets:
      DOKPLOY_API_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag on main; leave empty to deploy main
        required: false
        type: string

permissions: {}

concurrency:
  group: kengen-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'NakamaDevs/kengen' && vars.KENGEN_DEPLOY_APPROVED == 'true'
    runs-on:
      group: nakama-kengen-deploy
      labels: [self-hosted, macOS, ARM64, host-hdbmm]
    environment: kengen-production
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      DOCKER_HOST: unix:///Users/hdb/.orbstack/run/docker.sock
      MISE_IGNORED_CONFIG_PATHS: /Users/hdb/.config/mise/config.toml:/Users/hdb/Developer/nakamadevs/mise.toml
    steps:
      - name: Read deployment code from main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Check the release commit
        run: /opt/homebrew/bin/python3 -B deploy/dokploy/manage.py --check-ref --tag "$RELEASE_TAG"
      - name: Prepare the Mac mini tools
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/Users/hdb/homelab/bin:/Users/hdb/.local/bin:/opt/homebrew/bin:$PATH"
          printf '%s\n' /Users/hdb/homelab/bin /Users/hdb/.local/bin /opt/homebrew/bin >> "$GITHUB_PATH"
          test "$(hostname -s)" = hdbmm
          test "$(uname -sm)" = 'Darwin arm64'
          export DOCKER_CONFIG="$RUNNER_TEMP/kengen-docker"
          export MISE_DATA_DIR="/Users/hdb/Developer/runners/kengen-deploy-arm64/mise"
          export MISE_CACHE_DIR="/Users/hdb/Developer/runners/kengen-deploy-arm64/mise-cache"
          printf 'DOCKER_CONFIG=%s\nMISE_DATA_DIR=%s\nMISE_CACHE_DIR=%s\n' "$DOCKER_CONFIG" "$MISE_DATA_DIR" "$MISE_CACHE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$DOCKER_CONFIG"
          printf '{}\n' > "$DOCKER_CONFIG/config.json"
          ln -sfn /Users/hdb/.docker/cli-plugins "$DOCKER_CONFIG/cli-plugins"
          mise trust --yes "$GITHUB_WORKSPACE/mise.toml"
          mise install go golangci-lint actionlint gitleaks trivy
          docker version --format '{{.Server.Os}}/{{.Server.Arch}}'
          test "$(docker version --format '{{.Server.Os}}/{{.Server.Arch}}')" = linux/arm64
          python3 -c 'import tomllib'
      - name: Check deployment behavior
        run: mise run test:deploy
      - name: Test upstream behavior
        shell: bash
        run: |
          set -euo pipefail
          source_ref=HEAD
          if [ -n "$RELEASE_TAG" ]; then
            source_ref="refs/tags/$RELEASE_TAG"
          fi
          source_dir="$(mktemp -d "$RUNNER_TEMP/kengen-tests.XXXXXX")"
          trap 'rm -rf "$source_dir"' EXIT
          git archive "$source_ref" | tar -xf - -C "$source_dir"
          mise exec -- make -C "$source_dir" test
      - name: Build and deploy the release
        env:
          DOKPLOY_URL: http://localhost:3000
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          KENGEN_DOKPLOY_COMPOSE_ID: ${{ vars.KENGEN_DOKPLOY_COMPOSE_ID }}
          KENGEN_DEPLOY_APPROVED: 'true'
          SSL_CERT_FILE: /etc/ssl/cert.pem
        run: mise run deploy:dokploy -- --tag "$RELEASE_TAG"
