[tools]
go = "1.26.8"
golangci-lint = "2.13.2"
actionlint = "1.7.10"
gitleaks = "8.30.0"
trivy = "0.69.2"

[settings]
locked = true

[tasks."verify:quick"]
description = "Validate pinned tooling, fork CI gates, and upstream unit tests."
run = [
  "mise run test:deploy",
  "mise run test:versions",
  "mise run test:lint-tool-pin",
  "mise run test:ci-gates",
  "mise run test:local-quality-gates",
  "mise run test:dependency-policy",
  "make test-unit",
]

[tasks."test:lint-tool-pin"]
description = "Validate the immutable lint tool pin."
run = "bash tests/ci/test_lint_tool_pin.sh"

[tasks."test:ci-gates"]
description = "Validate the safe GitHub Actions fork boundary."
run = [
  "bash tests/ci/test_safe_fork_gates.sh",
  "bash tests/ci/test_divergence_manifest_attribution.sh",
  "bash tests/ci/test_pr3_review_requirements.sh",
  "bash tests/ci/test_pr3_security_hardening.sh",
  "bash tests/ci/test_push_main_verification.sh",
  "actionlint .github/workflows/*.yml",
]

[tasks."test:local-quality-gates"]
description = "Validate immutable local quality gate pins."
run = "bash tests/ci/test_local_quality_gates.sh"

[tasks."scan:secrets"]
description = "Scan complete reachable Git history for secrets."
run = "gitleaks git --config .gitleaks.toml --redact --no-banner"

[tasks."scan:secrets:staged"]
description = "Scan staged changes for secrets."
run = "gitleaks protect --staged --config .gitleaks.toml --redact --no-banner"

[tasks."test:secret-canary"]
description = "Confirm that secret scanning rejects a synthetic credential."
run = "bash tests/ci/test_secret_scan_canary.sh"

[tasks."review:dependencies"]
description = "Review dependency vulnerabilities and licenses."
run = "/usr/bin/python3 -B scripts/review_dependencies.py"

[tasks."check:upstream-compatibility"]
description = "Check the fork integration boundary against upstream-compatible files."
run = "bash scripts/validate-upstream-compatibility.sh"

[tasks.verify]
description = "Run fork CI, upstream test, and lint gates."
run = [
  "mise run test:deploy",
  "mise run test:versions",
  "mise run test:lint-tool-pin",
  "mise run test:ci-gates",
  "mise run test:local-quality-gates",
  "mise run test:dependency-policy",
  "mise run scan:secrets",
  "mise run scan:secrets:staged",
  "mise run test:secret-canary",
  "mise run review:dependencies",
  "mise run check:upstream-compatibility",
  "make test",
  "make lint",
]

[tasks."test:deploy"]
description = "Test Mac mini deployment guards without Docker or credentials."
run = "python3 -B -m unittest discover -s deploy/dokploy -p 'test_*.py'"

[tasks."deploy:dokploy"]
description = "Build local main or a release tag on the M1 mini and deploy through Dokploy's API."
run = "python3 -B deploy/dokploy/manage.py"

[tasks."deploy:credentials"]
description = "Cache the Dokploy key locally; read 1Password only when missing."
run = "python3 -B deploy/dokploy/credentials.py"

[tasks."deploy:credentials:save"]
description = "Back up the cached Dokploy key to 1Password once."
run = "python3 -B deploy/dokploy/credentials.py --save"

[tasks."deploy:status"]
description = "Check Dokploy and HTTPS health with the cached key."
run = "python3 -B deploy/dokploy/manage.py --status"

[tasks."test:dependency-policy"]
description = "Test the dependency review boundary."
run = "/usr/bin/python3 -B -m unittest discover -s tests/licenses"

[tasks."test:versions"]
description = "Test independent model and viewer version changes."
run = "python3 -B -m unittest discover -s tests/releases"

[tasks."version:show"]
description = "Show independent model and viewer versions."
run = "python3 -B scripts/component_versions.py show"

[tasks."version:bump"]
description = "Bump one component: models or viewer, then major, minor, or patch."
run = "python3 -B scripts/component_versions.py bump"

[tasks."version:tag"]
description = "Create an immutable local release tag for models or viewer."
run = "python3 -B scripts/component_versions.py tag"

[tasks."test:viewer"]
description = "Test model visualization semantics (Node.js 18 or later)."
run = "node --test tests/viewer/model.test.cjs"
